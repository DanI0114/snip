<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snip</title>
<link rel="stylesheet" href="./static/style.css">
</head>
<body>
  <header>
    <div class="wrap">
      <a class="logo" href="#"><span class="dot"></span>snip</a>
      <nav>
        <a href="">Shorten</a>
        <a href="">Why snip</a>
      </nav>
      <div class="header-actions">
        <a class="btn btn-primary" href="register">Sign up</a>
      </div>
    </div>
  </header>
 
  <main class="auth-main">
    <div class="auth-card">
      <div class="eyebrow">// welcome back</div>
      <h1>Sign in</h1>
      <p class="auth-sub">Pick up where you left off with your shortened links.</p>
 
      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input class="shrink-input mono" type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>
 
        <div class="field">
          <div class="field-row">
            <label for="password">Password</label>
            <a class="link-small mono" href="#">Forgot?</a>
          </div>
          <input class="shrink-input mono" type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
 
        <button class="btn btn-primary" type="submit">Sign in</button>
        <p class="form-success" id="success"></p>
        <p class="form-error" id="error"></p>
      </form>
 
      <p class="auth-switch">Don't have an account? <a href="register">Create one</a></p>
    </div>
  </main>
 
  <footer>
    <div class="wrap">
      <span class="mono">© 2026 snip</span>
      <nav>
        <a href="#">Terms</a>
        <a href="#">Privacy</a>
        <a href="#">Status</a>
      </nav>
    </div>
  </footer>

<script src="./static/app.js"></script>

</body>
</html>
